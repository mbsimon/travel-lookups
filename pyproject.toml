[project]
name = "travel-lookups"
version = "0.12.0"
description = "Read-only flight and rail schedule lookups for itinerary work"
requires-python = ">=3.11"
dependencies = ["requests>=2.28.0", "python-dotenv>=1.0.0"]

[project.optional-dependencies]
# Google Flights read from its own pages (google_flights.py). Optional so the
# consumers that never fetch fares (agency-hq, fora-apps) do not pull a
# browser; without it every direct read falls back to SerpApi. After
# installing, fetch a browser: `playwright install chromium`.
browser = ["playwright>=1.45,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["travel_lookups"]
