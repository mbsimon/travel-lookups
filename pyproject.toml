[project]
name = "travel-lookups"
version = "0.9.0"
description = "Read-only flight and rail schedule lookups for itinerary work"
requires-python = ">=3.11"
dependencies = ["requests>=2.28.0", "python-dotenv>=1.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["travel_lookups"]
